<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-name">{{ site.Title }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      {{- $current := . -}}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ else if $current.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>
