baseURL = 'https://ai.ericeaglstun.com/'
locale = 'en-us'
title = 'Eric Eaglstun · AI'
theme = 'ee-ai'

# One feed only: the home feed (/index.xml), which aggregates blog + deep-dives +
# practice (see themes/ee-ai/layouts/_default/rss.xml). Sections emit no feed of
# their own, so there's a single canonical feed to subscribe to.
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML']

# Empty table disables Hugo's default tag/category taxonomies. The glossary groups
# itself by a scalar `category` frontmatter field instead (see glossary/list.html).
[taxonomies]

# List-page thumbnails can come from the concepts/ workshop (which lives outside
# content/ so Hugo never publishes it). Mounting concepts/ into assets/concepts
# lets _default/list.html reach a post's concept art via resources.Match and emit
# only a small processed webp thumb - the raw workshop files stay unpublished.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "concepts"
    target = "assets/concepts"

[params]
  tagline = "A working notebook on AI & machine learning."
  description = "Eric Eaglstun's AI notebook - a curated glossary of AI/ML development terms, plus blog posts and deep dives on local inference, models, and the machinery underneath."
  # Link back to the main personal site.
  parentName = "ericeaglstun.com"
  parentURL = "https://ericeaglstun.com/"
  # Source repo (shown as a GitHub icon link in the footer).
  repoURL = "https://github.com/eaglstun/ai"
  # Threads profile (shown as a Threads icon link in the footer).
  threadsURL = "https://www.threads.com/@eaglstun.ai"

# Top nav. `weight` orders the items left-to-right.
[menu]
  [[menu.main]]
    name = "Glossary"
    pageRef = "/glossary"
    weight = 10
  [[menu.main]]
    name = "Practice"
    pageRef = "/practice"
    weight = 15
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 20
  [[menu.main]]
    name = "Deep Dives"
    pageRef = "/deep-dives"
    weight = 30
  [[menu.main]]
    name = "Why"
    pageRef = "/why"
    weight = 40
  [[menu.main]]
    name = "Search"
    pageRef = "/search"
    weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    tabWidth = 2

[services]
  [services.rss]
    limit = 20
