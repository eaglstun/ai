<h1>My Whole Deal Is Now a Toggle &mdash; concepts</h1>
<main>
<figure><img src="a-together-gag-panel.jpg">
<figcaption><b>A &middot; together / gag-panel</b><br>
<span class="idea">The toggle that swallowed the question.</span> A lone figure on a bare horizon reaching for one small light-switch floating in white space. New Yorker to the bone; carries the title by itself. (Garbled fake signature bottom-right, crop it.)</figcaption></figure>

<figure><img src="b-pollinations-collage.jpg">
<figcaption><b>B &middot; pollinations / collage</b><br>
<span class="idea">The dashboard showing nothing.</span> Small figure cross-legged before a wall of blank, torn paper panels. Moodier and quieter than witty; reads as sitting before a report that has nothing to say.</figcaption></figure>

<figure><img src="c-together-continuous-line.jpg">
<figcaption><b>C &middot; together / continuous-line</b><br>
<span class="idea">The door you reached for.</span> An eager figure leaning toward a door strangled in chains and a padlock. The "beta you can't open" beat, dead-on. (Came out ink-cartoon, not one-line, but funnier for it.)</figcaption></figure>

<figure><img src="d-replicate-woodcut.jpg">
<figcaption><b>D &middot; replicate / woodcut</b> &nbsp;<em>(mascot proposed)</em><br>
<span class="idea">The one thing kept.</span> Gorgeous Victorian engraving of a maker at a bench, the little dog beside him. Best craft of the four. TWO flags: (1) the dog read King-Charles-spaniel, not shih tzu (no floor-length coat), breed-likeness TODO; (2) it depicts hands-on <em>making</em>, which is the exact labor the post says isn't the point. Beautiful, but slightly argues with the thesis.</figcaption></figure>
